<div class="login-wrapper">
  <div class="login-card card">
    <!-- Encabezado Institucional -->
    <div class="login-header">
      <div class="brand-badge">
        <svg class="water-drop-icon" viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
          <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
        </svg>
      </div>
      <h2 class="brand-title">La Dorada S.A.S.</h2>
      <p class="brand-subtitle">Sistema de Pedidos e Inventario</p>
    </div>

    <!-- Alerta de Error si las credenciales fallan -->
    <div *ngIf="errorMensaje" class="alert alert--error">
      <span>⚠️ {{ errorMensaje }}</span>
    </div>

    <!-- Selector Rápido de Usuarios de Demostración -->
    <div class="demo-section">
      <span class="demo-title">Acceso rápido de prueba por rol:</span>
      <div class="demo-buttons">
        <button
          *ngFor="let u of usuariosPrueba"
          type="button"
          class="demo-card"
          [disabled]="cargando"
          (click)="seleccionarUsuario(u)"
        >
          <span class="demo-icon">{{ u.icono }}</span>
          <div class="demo-info">
            <strong>{{ u.etiqueta }}</strong>
            <small>{{ u.subtitulo }}</small>
          </div>
        </button>
      </div>
    </div>

    <div class="divider">
      <span>o ingresa manualmente</span>
    </div>

    <!-- Formulario Tradicional -->
    <form (ngSubmit)="iniciarSesion()" class="login-form">
      <div class="form-group">
        <label for="email" class="form-label">Correo Electrónico:</label>
        <input
          id="email"
          name="email"
          type="email"
          class="form-control"
          placeholder="ej. admin@ladorada.com"
          [(ngModel)]="email"
          [disabled]="cargando"
          required
        />
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Contraseña:</label>
        <input
          id="password"
          name="password"
          type="password"
          class="form-control"
          placeholder="••••••••"
          [(ngModel)]="password"
          [disabled]="cargando"
          required
        />
      </div>

      <button
        type="submit"
        class="btn btn--primary btn--block btn--lg"
        [disabled]="cargando"
      >
        <span *ngIf="!cargando">Iniciar Sesión &rarr;</span>
        <span *ngIf="cargando">Verificando credenciales...</span>
      </button>
    </form>

    <div class="login-footer">
      <p>Todo limpio, todo en orden.</p>
    </div>
  </div>
</div>
