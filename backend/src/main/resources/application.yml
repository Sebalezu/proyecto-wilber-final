server:
  port: 8080

spring:
  application:
    name: sistema-pedidos-inventario

  datasource:
    url: jdbc:mysql://localhost:3306/ladorada?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
    username: ladorada_user
    password: ladorada123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

ladorada:
  inventario:
    umbral-stock-bajo: ${UMBRAL_STOCK_BAJO:10}
